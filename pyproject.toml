[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdrive"
version = "0.1.0"
description = "Turn your AI assistant into your car concierge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentDrive contributors" }]
dependencies = ["PyYAML>=6.0.1", "cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agentdrive = "core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
