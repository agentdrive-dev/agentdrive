<svg xmlns="http://www.w3.org/2000/svg" width="880" height="180" viewBox="0 0 880 180" role="img">
  <title>Refresh token rotation</title>
  <rect width="880" height="180" fill="#f7f8fb"/>
  <text x="24" y="32" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2430">Refresh token rotation</text>
  <rect x="24" y="56" width="180" height="80" rx="8" fill="#fff" stroke="#1c2430"/>
  <text x="114" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1c2430">Old refresh token</text>
  <polygon points="216,96 248,96 248,88 272,106 248,124 248,116 216,116" fill="#1c2430"/>
  <rect x="284" y="56" width="220" height="80" rx="8" fill="#fff8e8" stroke="#1c2430"/>
  <text x="394" y="92" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1c2430">Write the new token</text>
  <text x="394" y="114" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1c2430">to disk first</text>
  <polygon points="516,96 548,96 548,88 572,106 548,124 548,116 516,116" fill="#1c2430"/>
  <rect x="584" y="56" width="260" height="80" rx="8" fill="#e7f0ea" stroke="#1c2430"/>
  <text x="714" y="92" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1c2430">Only then drop the old one</text>
  <text x="714" y="114" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1c2430">A failed write keeps it</text>
</svg>
