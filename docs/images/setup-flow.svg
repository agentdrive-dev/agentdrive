<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" role="img">
<title>Setup sequence</title>
<rect width="880" height="392" fill="#f7f8fb"/>
<text x="24" y="32" font-family="sans-serif" font-size="16" font-weight="700" fill="#1c2430">Setup sequence</text>
<rect x="24" y="48" width="832" height="34" rx="8" fill="#e7eefc" stroke="#1c2430"/>
<text x="44" y="70" font-family="sans-serif" font-size="14" fill="#1c2430">1. You: Read the disclaimer, then stop</text>
<rect x="24" y="90" width="832" height="34" rx="8" fill="#e7eefc" stroke="#1c2430"/>
<text x="44" y="112" font-family="sans-serif" font-size="14" fill="#1c2430">2. You: Accept it in a later message</text>
<rect x="24" y="132" width="832" height="34" rx="8" fill="#e7eefc" stroke="#1c2430"/>
<text x="44" y="154" font-family="sans-serif" font-size="14" fill="#1c2430">3. You: GitHub account and one login</text>
<rect x="24" y="174" width="832" height="34" rx="8" fill="#e7f0ea" stroke="#1c2430"/>
<text x="44" y="196" font-family="sans-serif" font-size="14" fill="#1c2430">4. Bot: Publish the public key and return the URL</text>
<rect x="24" y="216" width="832" height="34" rx="8" fill="#e7eefc" stroke="#1c2430"/>
<text x="44" y="238" font-family="sans-serif" font-size="14" fill="#1c2430">5. You: Developer application, card, and billing limit</text>
<rect x="24" y="258" width="832" height="34" rx="8" fill="#e7f0ea" stroke="#1c2430"/>
<text x="44" y="280" font-family="sans-serif" font-size="14" fill="#1c2430">6. Bot: Register the domain and start sign-in</text>
<rect x="24" y="300" width="832" height="34" rx="8" fill="#e7eefc" stroke="#1c2430"/>
<text x="44" y="322" font-family="sans-serif" font-size="14" fill="#1c2430">7. You: Approve scopes, then pair the key in the app</text>
<rect x="24" y="342" width="832" height="34" rx="8" fill="#e7f0ea" stroke="#1c2430"/>
<text x="44" y="364" font-family="sans-serif" font-size="14" fill="#1c2430">8. Bot: Doctor, status, and a parked lights flash</text>
</svg>
