<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img">
  <title>Illustrative example. Sample data. A made-up chat, not a vehicle reading or a transcript.</title>
  <rect width="960" height="640" fill="#fff4e8"/>
  <text x="48" y="56" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="28" font-weight="700" fill="#4a342c">A sample chat</text>
  <rect x="280" y="26" width="210" height="36" rx="18" fill="#ff7a59"/>
  <text x="385" y="50" text-anchor="middle" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="16" font-weight="700" fill="#fff8ef">Sample data</text>
  <text x="48" y="88" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="15" fill="#6b5348">Not a real transcript or a vehicle reading.</text>
  <circle cx="900" cy="52" r="18" fill="#ffd56a"/>

  <g transform="translate(100,250)">
    <ellipse cx="0" cy="62" rx="46" ry="10" fill="#e7c2a4"/>
    <path d="M-30,6 Q-36,52 -20,60 H20 Q36,52 30,6 Q16,-6 0,-6 Q-16,-6 -30,6" fill="#ff7a59" stroke="#4a342c" stroke-width="3"/>
    <circle cx="0" cy="-26" r="26" fill="#ffd0b5" stroke="#4a342c" stroke-width="3"/>
    <path d="M-22,-34 Q-22,-60 0,-62 Q22,-60 22,-34 Q12,-44 0,-42 Q-12,-44 -22,-34" fill="#6b3f2a" stroke="#4a342c" stroke-width="3"/>
    <circle cx="-8" cy="-28" r="3" fill="#4a342c"/>
    <circle cx="8" cy="-28" r="3" fill="#4a342c"/>
    <path d="M-8,-16 Q0,-8 8,-16" fill="none" stroke="#4a342c" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="100" y="340" text-anchor="middle" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="16" font-weight="700" fill="#4a342c">You</text>

  <g transform="translate(860,250)">
    <ellipse cx="0" cy="62" rx="46" ry="10" fill="#e7c2a4"/>
    <rect x="-30" y="2" width="60" height="58" rx="22" fill="#5ec4bc" stroke="#4a342c" stroke-width="3"/>
    <rect x="-26" y="-46" width="52" height="46" rx="20" fill="#7fd4cc" stroke="#4a342c" stroke-width="3"/>
    <line x1="0" y1="-46" x2="0" y2="-62" stroke="#4a342c" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-68" r="7" fill="#ffc857" stroke="#4a342c" stroke-width="3"/>
    <circle cx="-10" cy="-26" r="6" fill="#ffffff"/>
    <circle cx="10" cy="-26" r="6" fill="#ffffff"/>
    <circle cx="-8" cy="-25" r="2.5" fill="#4a342c"/>
    <circle cx="12" cy="-25" r="2.5" fill="#4a342c"/>
    <path d="M-8,-12 Q0,-4 8,-12" fill="none" stroke="#4a342c" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="860" y="340" text-anchor="middle" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="16" font-weight="700" fill="#4a342c">AI agent</text>

  <path d="M200,110 H690 Q730,110 730,146 V162 Q730,198 690,198 H240 L200,224 Z" fill="#ffffff" stroke="#4a342c" stroke-width="3" stroke-linejoin="round"/>
  <text x="465" y="164" text-anchor="middle" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="20" font-weight="700" fill="#4a342c">How much battery is left?</text>

  <path d="M760,240 H270 Q230,240 230,276 V292 Q230,328 270,328 H720 L760,354 Z" fill="#d9f3ee" stroke="#4a342c" stroke-width="3" stroke-linejoin="round"/>
  <text x="495" y="294" text-anchor="middle" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="20" font-weight="700" fill="#4a342c">Sample: about 80%.</text>

  <path d="M200,370 H520 Q560,370 560,406 V422 Q560,458 520,458 H240 L200,484 Z" fill="#ffffff" stroke="#4a342c" stroke-width="3" stroke-linejoin="round"/>
  <text x="380" y="424" text-anchor="middle" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="20" font-weight="700" fill="#4a342c">Flash the lights.</text>

  <path d="M760,500 H300 Q260,500 260,536 V552 Q260,588 300,588 H720 L760,614 Z" fill="#d9f3ee" stroke="#4a342c" stroke-width="3" stroke-linejoin="round"/>
  <text x="510" y="554" text-anchor="middle" font-family="Segoe UI, Trebuchet MS, sans-serif" font-size="20" font-weight="700" fill="#4a342c">Sample: flashed once.</text>
</svg>
