  <rect x="24" y="52" width="200" height="120" rx="10" fill="#e7f0ea" stroke="#1c2430"/>
  <text x="124" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1c2430">Who</text>
  <text x="124" y="116" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1c2430">AI agent</text>
