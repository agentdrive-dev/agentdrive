# OAuth scope sets. vehicle_location is the Fleet API scope for a location read.
# vehicle_charging_cmds is the scope for official charging history and invoices.
version: 1

default:
  - openid
  - offline_access
  - user_data
  - vehicle_device_data
  - vehicle_location
  - vehicle_cmds
  - vehicle_charging_cmds

optional:
  charging: vehicle_charging_cmds
